version: '3.8'

services:
  bot:
    build: ./bot
    env_file: .env
    depends_on:
      - db
    restart: always
    volumes:
      - ./bot:/app

  webapp:
    build: ./web-app
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - bot

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nano_banana}
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
